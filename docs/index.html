<!DOCTYPE html>
<html lang="uz">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QPOS Service — Fiskal API</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f7f8fa; --surface:#ffffff; --border:#e7e9ee; --border2:#eef0f3;
    --text:#1b1f27; --text2:#4b5563; --muted:#6b7280;
    --primary:#2f6bd6; --primary-soft:#eaf1fd;
    --panel:#0f141c; --panel2:#0b0f16; --ptext:#d7deea; --pkey:#7dd3fc; --pstr:#86efac; --pnum:#fca5a5; --pmuted:#5b6676;
    --post:#1e9e57; --get:#2f6bd6; --req:#d64545; --warn:#b7791f;
    --sb:280px; --code-w:460px;
  }
  [data-theme="dark"]{
    --bg:#0d1117; --bg2:#0f141b; --surface:#11161d; --border:#232a33; --border2:#1b222b;
    --text:#e6edf3; --text2:#c2ccd6; --muted:#8b949e;
    --primary:#589bff; --primary-soft:#15243a;
    --panel:#0a0e14; --panel2:#070a0f; --ptext:#d7deea; --pkey:#7dd3fc; --pstr:#9ae6b4; --pnum:#ff9a9a; --pmuted:#5b6676;
    --post:#43c37e; --get:#589bff; --req:#ff6b6b; --warn:#e2b24a;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:16px}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-size:14.5px; line-height:1.6;}
  a{color:var(--primary); text-decoration:none}
  code{font-family:"IBM Plex Mono","SF Mono",Consolas,monospace}

  .wrap{display:flex; min-height:100vh}
  .sidebar{width:var(--sb); flex:0 0 var(--sb); border-right:1px solid var(--border);
    background:var(--bg2); position:sticky; top:0; height:100vh; overflow-y:auto}
  .main{flex:1; min-width:0; padding:28px 40px 140px; max-width:1300px}

  .brand{display:flex; align-items:center; gap:10px; padding:16px 16px 10px}
  .logo{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}
  .brand b{font-size:15px}
  .search{margin:2px 14px 8px; position:relative}
  .search input{width:100%; height:34px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); border-radius:8px; padding:0 30px 0 30px; font-size:13px; outline:none}
  .search input:focus{border-color:var(--primary)}
  .search .mg{position:absolute; left:9px; top:8px; color:var(--muted); font-size:14px}
  .controls{display:flex; gap:6px; padding:2px 14px 12px; align-items:center}
  .pill{border:1px solid var(--border); background:var(--surface); color:var(--text2);
    border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600; cursor:pointer}
  .pill.active{background:var(--primary); color:#fff; border-color:var(--primary)}
  .theme-btn{margin-left:auto; border:1px solid var(--border); background:var(--surface);
    width:32px;height:30px;border-radius:8px;cursor:pointer;color:var(--text);font-size:14px}

  nav{padding:4px 10px 40px}
  .nav-group{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    font-weight:700; padding:14px 10px 5px}
  nav a{display:flex; align-items:center; gap:8px; color:var(--text2); padding:6px 10px;
    border-radius:7px; font-size:13px}
  nav a:hover{background:var(--bg)}
  nav a.active{background:var(--primary-soft); color:var(--primary); font-weight:600}
  .verb{font-size:9.5px; font-weight:800; letter-spacing:.3px; padding:2px 5px; border-radius:5px;
    color:#fff; flex:0 0 auto}
  .verb.post{background:var(--post)} .verb.get{background:var(--get)}

  h1{font-size:28px;margin:0 0 6px}
  .op-title{font-size:23px; margin:0 0 4px; font-weight:700}
  h2{font-size:20px; margin:40px 0 8px; padding-top:10px; border-top:1px solid var(--border)}
  h3{font-size:14.5px; margin:20px 0 6px; color:var(--text); text-transform:uppercase; letter-spacing:.4px; font-weight:700}
  p{color:var(--text2)} ul{color:var(--text2)}
  .section{margin-bottom:12px}

  /* operation 2-col */
  .op{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,var(--code-w)); gap:40px; align-items:start;
    padding:30px 0; border-top:1px solid var(--border)}
  .op-code{position:sticky; top:20px}

  /* params Scalar-like */
  .param{padding:11px 0; border-bottom:1px solid var(--border2)}
  .param-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px}
  .param-head code{font-weight:700; font-size:13.5px; color:var(--text)}
  .pt{color:var(--muted); font-size:12.5px}
  .req-badge{color:var(--req); font-size:11px; font-weight:700}
  .opt-badge{color:var(--muted); font-size:11px}
  .param-desc{color:var(--text2); font-size:13px; margin-top:3px}

  table{width:100%; border-collapse:collapse; margin:10px 0; font-size:13px}
  th,td{text-align:left; padding:8px 11px; border:1px solid var(--border); vertical-align:top; color:var(--text)}
  th{background:var(--bg2); color:var(--text2); font-size:12px; font-weight:600; text-transform:none; letter-spacing:0}
  tbody tr:nth-child(even) td{background:var(--bg2)}
  td code{background:var(--bg2); padding:1px 5px; border-radius:4px; color:var(--text)}

  .callout{border:1px solid var(--border); border-left:3px solid var(--primary); background:var(--bg2);
    border-radius:8px; padding:10px 13px; margin:12px 0; font-size:13.5px; color:var(--text2)}
  .kv td{border:none; padding:3px 0}

  /* code panel */
  .codecard{background:var(--panel); border:1px solid rgba(148,163,184,.14); border-radius:12px; overflow:hidden; margin-bottom:14px}
  .codebar{display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--panel2); border-bottom:1px solid rgba(148,163,184,.12)}
  .codebar .v{font-size:10px; font-weight:800; color:#fff; background:var(--post); padding:2px 6px; border-radius:5px}
  .codebar .u{font-family:"IBM Plex Mono",monospace; font-size:12px; color:#cbd5e1}
  .codebar .sp{margin-left:auto; font-size:11px; color:var(--pmuted)}
  .tabs{display:flex; gap:2px; padding:6px 8px 0; background:var(--panel2); flex-wrap:wrap}
  .tab{font-size:11.5px; color:var(--pmuted); padding:5px 9px; border-radius:6px 6px 0 0; cursor:pointer}
  .tab.active{color:#fff; background:var(--panel)}
  pre{margin:0; padding:13px 14px; overflow-x:auto; font-size:12.4px; line-height:1.55; color:var(--ptext)}
  pre code{color:inherit}
  .k{color:var(--pkey)} .s{color:var(--pstr)} .n{color:var(--pnum)}
  .resp-tabs{display:flex; gap:6px; padding:9px 12px; background:var(--panel2); border-bottom:1px solid rgba(148,163,184,.1)}
  .rtab{font-size:12px; font-weight:700; color:var(--pmuted); cursor:pointer; padding:2px 4px}
  .rtab.active{color:#fff} .rtab.ok{color:var(--post)} .rtab.err{color:var(--req)}

  .menu-toggle{display:none}
  @media(max-width:1080px){
    .op{grid-template-columns:1fr; gap:16px}
    .op-code{position:static}
  }
  @media(max-width:820px){
    .sidebar{position:fixed; z-index:50; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,.3)}
    body.nav-open .sidebar{transform:translateX(0)}
    .main{padding:60px 16px 100px}
    .menu-toggle{display:grid; position:fixed; top:12px; left:12px; z-index:60; width:38px;height:38px;
      border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); place-items:center; cursor:pointer; font-size:18px}
    .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40}
    body.nav-open .scrim{display:block}
  }
</style>

<button class="menu-toggle" onclick="document.body.classList.toggle('nav-open')">☰</button>
<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>

<div class="wrap">
  <aside class="sidebar">
    <div class="brand"><div class="logo">Q</div><b>QPOS API</b></div>
    <div class="search"><span class="mg">⌕</span><input id="search" placeholder="Search" /></div>
    <div class="controls">
      <button class="pill" data-lang="uz">UZ</button>
      <button class="pill" data-lang="ru">RU</button>
      <button class="pill" data-lang="en">EN</button>
      <button class="theme-btn" id="themeBtn" title="Theme">🌙</button>
    </div>
    <div style="padding:0 14px 10px">
      <a href="./openapi.json" download style="font-size:12px; color:var(--primary); font-weight:600">⤓ OpenAPI (Postman / codegen)</a>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="content"></main>
</div>

<script>
const UI={
  uz:{fields:"Javob maydonlari",field:"Maydon",type:"Tur",note:"Izoh",required:"majburiy",optional:"ixtiyoriy",
      recommended:"tavsiya",conditional:"shartli",request:"So'rov",response:"Javob",body:"Body"},
  ru:{fields:"Поля ответа",field:"Поле",type:"Тип",note:"Описание",required:"обязат.",optional:"необяз.",
      recommended:"рекоменд.",conditional:"условно",request:"Запрос",response:"Ответ",body:"Body"},
  en:{fields:"Response fields",field:"Field",type:"Type",note:"Note",required:"required",optional:"optional",
      recommended:"recommended",conditional:"conditional",request:"Request",response:"Response",body:"Body"}
};
const GROUPS={
  start:{uz:"Boshlanish",ru:"Начало",en:"Getting started"},
  receipts:{uz:"Cheklar",ru:"Чеки",en:"Receipts"},
  shift:{uz:"Smena",ru:"Смена",en:"Shift"},
  other:{uz:"Prochee",ru:"Прочее",en:"Other"},
  examples:{uz:"Misollar",ru:"Примеры",en:"Examples"}
};
const ORDER=["start","receipts","shift","other","examples"];
const M=(u,r,e)=>({u,r,e});

/* sections: start=prose; others=operations (verb+method -> 2col with code panel) */
const SECTIONS=[
  {id:"intro",grp:"start",title:M("Umumiy ma'lumot","Обзор","Introduction"),blocks:[
    {p:M("QPOS Service — tashqi POS ilovalari uchun lokal fiskal API. Sotuv/qaytarish cheklari, Z-hisobot va fiskal modul (FM) ma'lumotlari shu API orqali boshqariladi.",
      "QPOS Service — локальный фискальный API для сторонних POS-приложений. Через него управляются чеки продажи/возврата, Z-отчёт и данные фискального модуля (ФМ).",
      "QPOS Service is a local fiscal API for third-party POS apps. Sale/refund receipts, Z-report and Fiscal Module (FM) info are managed through it.")},
    {kv:[["Base URL","http://127.0.0.1:2040/api"],["Method","POST"],["Content-Type","application/json"],[M("Auth","Auth","Auth"),"X-Api-Key (required)"]]},
    {p:M("Barcha metodlar POST http://127.0.0.1:2040/api manziliga, body'da \"method\" maydoni bilan yuboriladi. Har so'rovda X-Api-Key header majburiy.",
      "Все методы вызываются POST на http://127.0.0.1:2040/api с полем \"method\" в body. В каждом запросе обязателен заголовок X-Api-Key.",
      "All methods are POST to http://127.0.0.1:2040/api with a \"method\" field in the body. Every request requires the X-Api-Key header.")}
  ]},
  {id:"errors",grp:"start",title:M("Xato kodlari","Коды ошибок","Error codes"),blocks:[
    {table:{h:["code","message",M("Izoh","Описание","Note")],rows:[
      ["0","OK",M("Muvaffaqiyat","Успех","Success")],
      ["401","UNAUTHORIZED",M("API kalit noto'g'ri/yo'q","API-ключ неверный/отсутствует","Invalid/missing API key")],
      ["-32601","METHOD_NOT_FOUND",M("Noma'lum method","Неизвестный method","Unknown method")],
      ["-32099","PARSE_ERROR",M("Noto'g'ri JSON","Неверный JSON","Malformed JSON")],
      ["-32000","FISCAL_ERROR",M("FM umumiy xato (data da asl matn)","Общая ошибка ФМ","Generic FM error")],
      ["9031","SEND_ALL_RECEIPTS_FIRST",M("48 soatdan ortiq oflayn — avval cheklarni yuboring","Более 48ч офлайн — сначала отправьте чеки","Offline >48h — send pending first")],
      ["—","FIELD_VALIDATION_FAILED",M("FiscalDriveService eskirgan — yangilash kerak","FiscalDriveService устарел","FiscalDriveService outdated")],
      ["—","NO_CARD_FOUND",M("Fiskal modul ulanmagan","ФМ не подключён","FM not connected")],
      ["—","RECEIPT_NOT_FISCALIZED",M("Chek fiskallashmadi (bo'sh QR)","Чек не фискализирован","Receipt not fiscalized")],
      ["50021","ERROR_ZREPORT_IS_ALREADY_OPEN",M("Z-hisobot allaqachon ochiq","Z-отчёт уже открыт","Z-report already open")],
      ["50021","ERROR_CURRENT_ZREPORT_IS_EMPTY",M("Z-hisobot bo'sh/yopiq","Z-отчёт пуст/закрыт","Z-report empty/closed")],
      ["—","MARK_REQUIRED / DUPLICATE / INVALID",M("Markirovka xatolari","Ошибки маркировки","Mark errors")],
      ["—","CASH_SALE_NOT_ALLOWED / CASH_LIMIT_EXCEEDED",M("Naqd sotish cheklovi","Ограничение нал. продажи","Cash sale limit")],
      ["—","REFUND_RECEIPT_NOT_FOUND",M("Qaytarish uchun chek topilmadi","Чек для возврата не найден","Sale receipt not found")]
    ]}}
  ]},
  {id:"conventions",grp:"start",title:M("Konventsiyalar","Соглашения","Conventions"),blocks:[
    {ul:[
      M("Summalar — tiyinda (1 so'm=100 tiyin). BUTUN SON; kasr rad etiladi.","Суммы — в тийинах. ЦЕЛОЕ; дробное отклоняется.","Amounts in tiyin. INTEGER; decimals rejected."),
      M("Amount: 1000 = 1 dona (0.5 dona → 500).","Amount: 1000 = 1 шт (0,5 → 500).","Amount: 1000 = 1 unit (0.5 → 500)."),
      M("OwnerType: 0 qayta sotish, 1 o'z ishlab chiqarish, 2 xizmat.","OwnerType: 0 перепродажа, 1 собств. произв., 2 услуга.","OwnerType: 0 resale, 1 own production, 2 service."),
      M("PaymentType: 1 naqd, 2 karta, 3 QR, 4 aralash. CardType: 1 korp, 2 jismoniy.","PaymentType: 1 нал, 2 карта, 3 QR, 4 смеш. CardType: 1 корп, 2 физ.","PaymentType: 1 cash, 2 card, 3 QR, 4 mixed. CardType: 1 corp, 2 indiv.")
    ]}
  ]},

  /* ---- Cheklar ---- */
  {id:"sale",grp:"receipts",verb:"POST",method:"SaleReceipt",
    title:M("Sotuv cheki","Пробить чек продажи","Sale receipt"),
    desc:M("Sotuv chekini shakllantiradi, summani FMda ro'yxatga oladi, chek raqami + fiskal imzo qaytaradi.",
      "Формирует чек продажи, регистрирует сумму в ФМ, возвращает номер чека + фискальный признак.",
      "Builds a sale receipt, registers the amount in the FM, returns receipt no. + fiscal sign."),
    body:[
      ["Cashier","string","rec",M("Kassir ismi (chekda chop etiladi)","Имя кассира (печатается)","Cashier name (printed)")],
      ["ReceiptNumber","string","req",M("Idempotentlik kaliti — yagona (GUID 36 ham). Takrorlansa to'liq oldingi natija qaytadi.","Ключ идемпотентности — уникальный (GUID 36). При повторе — полный прежний ответ.","Idempotency key — unique (GUID 36). On repeat returns the full prior result.")],
      ["ReceivedCash / ReceivedCard","uint64","req",M("Naqd / naqdsiz (tiyin)","Наличные / безнал (тийин)","Cash / card (tiyin)")],
      ["PaymentType","uint8","opt",M("1/2/3/4. Yo'q → avtomat","1/2/3/4. Нет → авто","1/2/3/4. None → auto")],
      ["Time","string","req","YYYY-MM-DD HH:MM:SS"],
      ["Location.Latitude / Longitude","float64","rec",M("Koordinatalar. Yo'q → 0,0 (sozlamadan OLINMAYDI)","Координаты. Нет → 0,0 (НЕ из настроек)","Coords. Missing → 0,0 (NOT from settings)")],
      ["ExtraInfo.CardType","uint8","opt",M("1 korp / 2 jismoniy. Boshqa: CarNumber, CardNumber, TIN, PINFL…","1 корп / 2 физ. Также: CarNumber, CardNumber, TIN, PINFL…","1 corp / 2 indiv. Also: CarNumber, CardNumber, TIN, PINFL…")],
      ["Items[].Name / SPIC","string","req",M("Nom / MXIK (17 xona)","Наименование / МХИК (17)","Name / MXIK (17)")],
      ["Items[].Label","string","cond",M("Markirovka — faqat markirovkali (is_labeled) tovar uchun","Маркировка — только для маркируемых","Mark — only for marked goods")],
      ["Items[].Units / PackageCode","uint64/string","req",M("O'lchov birligi kodi / package kodi","Код ед. / код упаковки","Unit / package code")],
      ["Items[].Amount","uint64","req",M("Miqdor (1000 = 1 dona)","Кол-во (1000 = 1 шт)","Qty (1000 = 1 unit)")],
      ["Items[].Price / Discount","uint64","req",M("Summa / chegirma (tiyin)","Сумма / скидка (тийин)","Price / discount (tiyin)")],
      ["Items[].VATPercent / VAT","uint8/uint64","req",M("QQS % / summasi","% / сумма НДС","VAT % / amount")],
      ["Items[].OwnerType","uint8","req",M("0/1/2 (o'z ishlab chiqarish = 1)","0/1/2 (собств. произв. = 1)","0/1/2 (own production = 1)")],
      ["Items[].CommissionInfo","object","opt",`{ "TIN":"", "PINFL":"" }`]
    ],
    req:`{
  "method": "SaleReceipt",
  "params": {
    "Cashier": "Ismoilova Shahlo",
    "ReceiptNumber": "138",
    "ReceivedCash": 1900000, "ReceivedCard": 0,
    "Time": "2025-12-24 11:34:34",
    "Location": { "Latitude": 40.12, "Longitude": 65.36 },
    "ExtraInfo": { "CardType": 1 },
    "Items": [{
      "Name": "ASKORBINKA, TAB. N1", "SPIC": "02106999028144288",
      "Barcode": "4780046713435", "Label": "",
      "Units": 1, "PackageCode": "1334671", "OwnerType": 0,
      "Amount": 1000, "VATPercent": 12, "Price": 2000000,
      "Discount": 100000, "Other": 0, "VAT": 203600,
      "CommissionInfo": { "TIN": "", "PINFL": "" }
    }]
  }
}`,
    res:[
      {s:"200",ok:1,code:`{
  "code": 0, "message": "OK",
  "data": {
    "QRCodeURL": "https://ofd.soliq.uz/check?t=ZZ9...&s=345221994543",
    "TerminalID": "ZZ999999999956",
    "ReceiptSeq": "280",
    "DateTime": "20201114170239",
    "FiscalSign": "345221994543"
  }
}`},
      {s:"400",ok:0,code:`{ "code": -32000, "message": "9031", "data": "SEND_ALL_RECEIPTS_FIRST: ..." }`},
      {s:"401",ok:0,code:`{ "code": 401, "message": "UNAUTHORIZED", "data": "Invalid X-Api-Key" }`}
    ],
    flds:[
      ["QRCodeURL","string",M("Chek QR. Avans/kredit chekda bo'sh — normal; savdoda bo'sh → fiskallashmagan (xato).","QR чека. Для аванса/кредита пусто — норма; для продажи пусто → не фискализирован.","Receipt QR. Empty for advance/credit — normal; for sale empty → not fiscalized.")],
      ["ReceiptSeq / FiscalSign","string",M("Chek raqami / fiskal imzo","Номер чека / фиск. признак","Receipt no. / fiscal sign")],
      ["DateTime","string",M("Ro'yxat vaqti","Время регистрации","Registration time")]
    ]},

  {id:"refund",grp:"receipts",verb:"POST",method:"RefundReceipt",
    title:M("Qaytarish cheki","Пробить чек возврата","Refund receipt"),
    desc:M("SaleReceipt bilan bir xil + majburiy RefundInfo (qaytariladigan asl chek). RefundInfo bo'sh → REFUND_RECEIPT_NOT_FOUND.",
      "Как SaleReceipt + обязательный RefundInfo (исходный чек). Пустой RefundInfo → REFUND_RECEIPT_NOT_FOUND.",
      "Same as SaleReceipt + required RefundInfo (original receipt). Empty RefundInfo → REFUND_RECEIPT_NOT_FOUND."),
    body:[
      ["RefundInfo.TerminalID","string","req",M("Asl chek FM seriya raqami","Сер.№ ФМ исходного","Original FM serial")],
      ["RefundInfo.ReceiptSeq","string","req",M("Asl chek raqami","Номер исходного чека","Original receipt no.")],
      ["RefundInfo.DateTime","string","req",M("Asl chek vaqti","Время исходного","Original time")],
      ["RefundInfo.FiscalSign","string","req",M("Asl chek fiskal imzosi","Фиск. признак исходного","Original fiscal sign")]
    ],
    req:`{
  "method": "RefundReceipt",
  "params": {
    "ReceiptNumber": "138", "Cashier": "Ismoilova Shahlo",
    "ReceivedCash": 300000, "ReceivedCard": 0,
    "Time": "2023-08-29 16:56:42",
    "Location": { "Latitude": 41.296591, "Longitude": 69.217919 },
    "Items": [{ "SPIC": "03808001001000000", "Name": "...", "Units": 1476512,
      "Amount": 1000, "Price": 300000, "Discount": 0, "VATPercent": 12, "VAT": 0,
      "CommissionInfo": { "PINFL": "", "TIN": "" } }],
    "RefundInfo": { "TerminalID": "NA000000036172", "ReceiptSeq": "49",
      "DateTime": "20230829163133", "FiscalSign": "155580527246" }
  }
}`,
    res:[
      {s:"200",ok:1,code:`{ "code": 0, "message": "OK", "data": { "QRCodeURL": "https://ofd.soliq.uz/check?...", "ReceiptSeq": "281", "FiscalSign": "..." } }`},
      {s:"400",ok:0,code:`{ "code": -32000, "message": "REFUND_RECEIPT_NOT_FOUND", "data": "..." }`}
    ]},

  {id:"advance",grp:"receipts",verb:"POST",method:"AdvanceReceipt",
    title:M("Avans / kredit chek","Авансовый / кредитный","Advance / credit"),
    desc:M("SaleReceipt bilan bir xil, lekin chek FMda ro'yxatga OLINMAYDI — javobda ReceiptSeq va FiscalSign bo'sh (QR ham bo'sh).",

let lang=localStorage.getItem("qpos-lang")||"uz";
const L=x=>x==null?"":(typeof x==="string"?x:(x[lang]||x.u||""));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hl=c=>esc(c)
  .replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="k">$1</span>$2')
  .replace(/:\s*(&quot;[^&]*?&quot;)/g,': <span class="s">$1</span>')
  .replace(/:\s*(-?\d+\.?\d*|true|false|null)/g,': <span class="n">$1</span>');

function badge(c){const u=UI[lang];
  if(c==="req")return `<span class="req-badge">${u.required}</span>`;
  if(c==="opt")return `<span class="opt-badge">${u.optional}</span>`;
  if(c==="rec")return `<span class="opt-badge" style="color:var(--warn)">${u.recommended}</span>`;
  if(c==="cond")return `<span class="opt-badge" style="color:var(--warn)">${u.conditional}</span>`;
  return "";}

function paramRow(r){
  return `<div class="param"><div class="param-head"><code>${esc(r[0])}</code><span class="pt">${esc(r[1])}</span>${badge(r[2])}</div><div class="param-desc">${esc(L(r[3]))}</div></div>`;
}
function proseBlock(b){const u=UI[lang];
  if(b.p)return `<p>${esc(L(b.p))}</p>`;
  if(b.ul)return `<ul>${b.ul.map(x=>`<li>${esc(L(x))}</li>`).join("")}</ul>`;
  if(b.callout)return `<div class="callout">${esc(L(b.callout))}</div>`;
  if(b.kv)return `<table class="kv"><tbody>${b.kv.map(r=>`<tr><td><b>${esc(L(r[0]))}</b></td><td><code>${esc(L(r[1]))}</code></td></tr>`).join("")}</tbody></table>`;
  if(b.table){const h=b.table.h.map(x=>`<th>${esc(L(x))}</th>`).join("");
    const rows=b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(L(c))}</td>`).join("")}</tr>`).join("");
    return `<table><thead><tr>${h}</tr></thead><tbody>${rows}</tbody></table>`;}
  if(b.raw)return `<div class="codecard"><div class="tabs"><span class="tab active">${esc(b.raw)}</span></div><pre><code>${esc(b.code)}</code></pre></div>`;
  return "";
}
function codePanel(s){const u=UI[lang];
  let html=`<div class="codecard"><div class="codebar"><span class="v">${s.verb}</span><span class="u">/api</span><span class="sp">${esc(s.method)}</span></div>`;
  html+=`<div class="tabs"><span class="tab active">${u.request} · JSON</span></div><pre><code>${hl(s.req)}</code></pre></div>`;
  if(s.res&&s.res.length){
    html+=`<div class="codecard"><div class="resp-tabs" data-resp="${s.id}">`+
      s.res.map((r,i)=>`<span class="rtab ${r.ok?'ok':'err'} ${i===0?'active':''}" data-i="${i}">${esc(r.s)}</span>`).join("")+`</div>`;
    html+=s.res.map((r,i)=>`<pre data-ri="${i}" style="${i===0?'':'display:none'}"><code>${hl(r.code)}</code></pre>`).join("");
    html+=`</div>`;
  }
  return html;
}

function render(){
  let nav="",html="";
  ORDER.forEach(g=>{
    const secs=SECTIONS.filter(s=>s.grp===g); if(!secs.length)return;
    nav+=`<div class="nav-group">${esc(GROUPS[g][lang])}</div>`;
    secs.forEach(s=>{
      const vb=s.verb?`<span class="verb ${s.verb.toLowerCase()}">${s.verb}</span>`:"";
      nav+=`<a href="#${s.id}" data-id="${s.id}">${vb}<span>${esc(L(s.title))}</span></a>`;
      if(s.verb){ // operation
        let left=`<div class="op-title">${esc(L(s.title))}</div><p>${esc(L(s.desc))}</p>`;
        if(s.body){ left+=`<h3>${UI[lang].body}</h3>`+s.body.map(paramRow).join(""); }
        if(s.flds){ left+=`<h3>${UI[lang].fields}</h3>`+s.flds.map(paramRow).join(""); }
        html+=`<section id="${s.id}"><div class="op"><div class="op-doc">${left}</div><div class="op-code">${codePanel(s)}</div></div></section>`;
      } else {
        html+=`<section id="${s.id}" class="section"><h2>${esc(L(s.title))}</h2>${s.blocks.map(proseBlock).join("")}</section>`;
      }
    });
  });
  document.getElementById("nav").innerHTML=nav;
  document.getElementById("content").innerHTML=`<h1>QPOS Service — Fiskal API</h1>`+html;
  document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("active",p.dataset.lang===lang));
  bindResp(); scrollSpy(); filterNav(document.getElementById("search").value);
}
function bindResp(){
  document.querySelectorAll(".resp-tabs").forEach(bar=>{
    bar.addEventListener("click",e=>{
      const t=e.target.closest(".rtab"); if(!t)return;
      const card=bar.parentElement;
      card.querySelectorAll(".rtab").forEach(x=>x.classList.remove("active"));
      t.classList.add("active");
      card.querySelectorAll("pre[data-ri]").forEach(p=>p.style.display=(p.dataset.ri===t.dataset.i?"":"none"));
    });
  });
}
let spy;
function scrollSpy(){
  if(spy)spy.disconnect();
  const links=[...document.querySelectorAll("nav a")];
  spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle("active",l.dataset.id===e.target.id));}),{rootMargin:"-8% 0px -80% 0px"});
  document.querySelectorAll("section").forEach(s=>spy.observe(s));
}
function filterNav(q){
  q=(q||"").trim().toLowerCase();
  document.querySelectorAll("nav a").forEach(a=>{
    a.style.display=(!q||a.textContent.toLowerCase().includes(q))?"flex":"none";
  });
  document.querySelectorAll(".nav-group").forEach(g=>{
    let n=g.nextElementSibling,any=false;
    while(n&&n.tagName==="A"){ if(n.style.display!=="none")any=true; n=n.nextElementSibling; }
    g.style.display=any?"":"none";
  });
}

document.querySelector(".controls").addEventListener("click",e=>{const p=e.target.closest(".pill");if(p){lang=p.dataset.lang;localStorage.setItem("qpos-lang",lang);render();}});
document.getElementById("nav").addEventListener("click",()=>document.body.classList.remove("nav-open"));
document.getElementById("search").addEventListener("input",e=>filterNav(e.target.value));
const tb=document.getElementById("themeBtn");
function theme(t){document.documentElement.setAttribute("data-theme",t);tb.textContent=t==="dark"?"☀️":"🌙";localStorage.setItem("qpos-theme",t);}
tb.addEventListener("click",()=>theme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));
theme(localStorage.getItem("qpos-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
render();
</script>
